<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Board Designer</title>

    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

    <!-- Babel (JSX変換用) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        /* カスタムスクロールバーなどの微調整 */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }

        ::-webkit-scrollbar-thumb {
            background: #ccc;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #bbb;
        }

        .cursor-crosshair {
            cursor: crosshair;
        }

        /* アニメーション */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-5px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-fade-in {
            animation: fadeIn 0.2s ease-out forwards;
        }

        @media print {
            @page {
                size: A4 portrait;
                margin: 10mm;
            }

            body {
                background: white;
                height: auto;
                width: auto;
                overflow: visible;
            }

            #root>div.flex {
                display: block !important;
                height: auto !important;
                overflow: visible !important;
            }

            .no-print {
                display: none !important;
            }

            .print-only {
                display: block !important;
            }

            .print-page {
                page-break-after: always;
                height: 95vh;
                position: relative;
                overflow: visible;
            }

            .print-page:last-child {
                page-break-after: auto;
            }

            .no-print {
                display: none !important;
            }
        }

        .print-only {
            display: none;
        }
    </style>
</head>

<body class="bg-gray-100 text-gray-800 h-screen w-screen overflow-hidden">
    <div id="root" class="h-full w-full"></div>

    <script type="text/babel">
        const { useState, useRef, useEffect, useCallback } = React;

        // --- アイコンコンポーネント (Lucide Reactの代わり) ---
        const Icon = ({ d, size = 16, className = "", ...props }) => (
            <svg
                xmlns="http://www.w3.org/2000/svg"

                height={size}

                strokeLinejoin="round"
                className={className}

        );

        // 各アイコンのパス定義
        const Icons = {
            Grid3X3: <path d="M3 3h7v7H3zM14 3h7v7h-7zM14 14h7v7h-7zM3 14h7v7H3z" />,
            MousePointer2: <><polyline points="12 6 14 4 18 8" /><polyline points="10 2 2 10" /><polyline points="13 6 7 12" /><polyline points="12 22 2 12" /><polyline points="17 17 21 13" /><polyline points="11 11 14 14" /></>,
            Activity: <path d="M22 12h-4l-3 9L9 3l-3 9H2" />,
            Box: <><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z" /><path d="m3.3 7 8.7 5 8.7-5" /><path d="M12 22.08V12" /></>,
            Zap: <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" />,
            Cpu: <><rect x="4" y="4" width="16" height="16" rx="2" /><rect x="9" y="9" width="6" height="6" /><path d="M15 2v2" /><path d="M15 20v2" /><path d="M2 15h2" /><path d="M2 9h2" /><path d="M20 15h2" /><path d="M20 9h2" /><path d="M9 2v2" /><path d="M9 20v2" /></>,
            Trash2: <><path d="M3 6h18" /><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6" /><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2" /><line x1="10" x2="10" y1="11" y2="17" /><line x1="14" x2="14" y1="11" y2="17" /></>,
            RotateCw: <><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8" /><path d="M21 3v5h-5" /></>,
            RotateCcw: <><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" /><path d="M3 3v5h5" /></>,
            Settings: <><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.1a2 2 0 0 1-1-1.74v-.47a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.35a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z" /><circle cx="12" cy="12" r="3" /></>,
            Type: <><polyline points="4 7 4 4 20 4 20 7" /><line x1="9" x2="15" y1="20" y2="20" /><line x1="12" x2="12" y1="4" y2="20" /></>,
            ToggleLeft: <><rect width="20" height="12" x="2" y="6" rx="6" ry="6" /><circle cx="8" cy="12" r="2" /></>,
            ToggleRight: <><rect width="20" height="12" x="2" y="6" rx="6" ry="6" /><circle cx="16" cy="12" r="2" /></>,
            Save: <><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z" /><polyline points="17 21 17 13 7 13 7 21" /><polyline points="7 3 7 8 15 8" /></>,
            FolderOpen: <path d="M6 14l1.45-2.9A2 2 0 0 1 9.24 10H20a2 2 0 0 1 1.94 2.5l-1.55 6a2 2 0 0 1-1.94 1.5H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3.9a2 2 0 0 1 1.69.9l.81 1.2a2 2 0 0 0 1.67.9H18a2 2 0 0 1 2 2v2" />,
            FilePlus: <><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z" /><path d="M14 2v4a2 2 0 0 0 2 2h4" /><path d="M9 15h6" /><path d="M12 18v-6" /></>,
            Minus: <line x1="5" x2="19" y1="12" y2="12" />,
            Plus: <><line x1="12" x2="12" y1="5" y2="19" /><line x1="5" x2="19" y1="12" y2="12" /></>,
            Layers: <><polygon points="12 2 2 7 12 12 22 7 12 2" /><polyline points="2 17 12 22 22 17" /><polyline points="2 12 12 17 22 12" /></>,
            Repeat: <><polyline points="17 2 21 6 17 10" /><path d="M3 11v-1a4 4 0 0 1 4-4h14" /><polyline points="7 22 3 18 7 14" /><path d="M21 13v1a4 4 0 0 1-4 4H3" /></>,
            Palette: <><circle cx="12" cy="12" r="10" /><circle cx="12.01" cy="18.5" r="1.5" /><circle cx="12.01" cy="7.5" r="1.5" /><circle cx="18.5" cy="12" r="1.5" /><circle cx="5.5" cy="12" r="1.5" /></>,
            Eye: <><path d="M1 12c0 0 4-8 11-8s11 8 11 8-4 8-11 8-11-8-11-8" /><circle cx="12" cy="12" r="3" /></>,
            ArrowUp: <><line x1="12" x2="12" y1="19" y2="5" /><polyline points="5 12 12 5 19 12" /></>,
            ArrowDown: <><line x1="12" x2="12" y1="5" y2="19" /><polyline points="19 12 12 19 5 12" /></>,
            ArrowLeft: <><line x1="19" x2="5" y1="12" y2="12" /><polyline points="12 19 5 12 12 5" /></>,
            ArrowRight: <><line x1="5" x2="19" y1="12" y2="12" /><polyline points="12 5 19 12 12 19" /></>,
            Move: <><polyline points="5 9 2 12 5 15" /><polyline points="9 5 12 2 15 5" /><polyline points="15 19 12 22 9 19" /><polyline points="19 15 22 12 19 9" /><line x1="2" x2="22" y1="12" y2="12" /><line x1="12" x2="12" y1="2" y2="22" /></>,
            List: <><line x1="8" y1="6" x2="21" y2="6" /><line x1="8" y1="12" x2="21" y2="12" /><line x1="8" y1="18" x2="21" y2="18" /><line x1="3" y1="6" x2="3.01" y2="6" /><line x1="3" y1="12" x2="3.01" y2="12" /><line x1="3" y1="18" x2="3.01" y2="18" /></>,
            Junction: <><line x1="2" x2="22" y1="12" y2="12" /><line x1="12" x2="12" y1="2" y2="22" /><circle cx="12" cy="12" r="4" fill="currentColor" /></>,
            Printer: <><polyline points="6 9 6 2 18 2 18 9" /><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2" /><rect width="12" height="8" x="6" y="14" /></>
        };

        // --- モーダルコンポーネント ---
        const Modal = ({ isOpen, type, message, title, children, onClose, onConfirm }) => {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 animate-fade-in">
                    <div className="bg-white p-6 rounded-lg shadow-xl max-w-md w-full mx-4 border border-gray-200 overflow-hidden flex flex-col max-h-[80vh]">
                        {title && <h3 className="text-lg font-bold mb-4 text-gray-800">{title}</h3>}
                        <div className="mb-4 text-gray-800 text-sm whitespace-pre-wrap leading-relaxed overflow-y-auto custom-scrollbar">
                            {message && <p>{message}</p>}
                            {children}
                        </div>
                        <div className="flex justify-end gap-3 pt-2 border-t border-gray-100 flex-shrink-0">
                            {(type === 'confirm' || type === 'custom') && (
                                <button
                                    onClick={onClose}
                                    className="px-4 py-2 text-sm text-gray-600 bg-gray-100 hover:bg-gray-200 rounded font-medium transition-colors"
                                >
                                    {type === 'custom' ? '閉じる' : 'キャンセル'}
                                </button>
                            )}
                            {type !== 'custom' && (
                                <button
                                    onClick={() => {
                                        if (type === 'confirm' && onConfirm) onConfirm();
                                        onClose();
                                    }}
                                    className="px-4 py-2 text-sm bg-indigo-600 text-white rounded hover:bg-indigo-700 font-medium shadow-sm transition-colors"
                                >
                                    OK
                                </button>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        // --- 初期設定 ---
        const PIXELS_PER_MM = 8;
        const DEFAULT_PITCH = 2.54;
        const DEFAULT_GRID_SIZE = DEFAULT_PITCH * PIXELS_PER_MM;

        // グリッド座標 ↔ ピクセル座標の変換関数
        const gridToPixel = (gridCoord, gridSize) => gridCoord * gridSize;
        const pixelToGrid = (pixelCoord, gridSize) => Math.round(pixelCoord / gridSize);

        const DEFAULT_BOARD_WIDTH = 40;
        const DEFAULT_BOARD_HEIGHT = 30;
        const HOLE_RADIUS = 2;

        const COMPONENT_PREFIXES = {
            resistor: 'R',
            capacitor: 'C',
            ic_dip: 'U',
            jumper: 'J',
            general: 'P'
        };

        const getComponentPinOffsets = (type, width, height) => {
            const pins = [];
            if (type === 'resistor' || type === 'capacitor') {
                pins.push({ x: 0, y: 0 });
                pins.push({ x: width - 1, y: 0 });
            } else if (type === 'ic_dip') {
                for (let x = 0; x < width; x++) {
                    pins.push({ x, y: 0 });
                    pins.push({ x, y: height - 1 });
                }
            } else if (type === 'jumper' || type === 'general') {
                for (let x = 0; x < width; x++) {
                    for (let y = 0; y < height; y++) {
                        pins.push({ x, y });
                    }
                }
            }
            return pins;
        };

        // 配線の描画ポイント計算ヘルパー
        const calculateWirePoints = (x1, y1, x2, y2, routeType, gridSize) => {
            const sx = x1 * gridSize;
            const sy = y1 * gridSize;
            const ex = x2 * gridSize;
            const ey = y2 * gridSize;

            if (routeType === 'VH') {
                // 縦 -> 横
                return `${sx},${sy} ${sx},${ey} ${ex},${ey}`;
            } else {
                // 横 -> 縦 (デフォルト 'HV')
                return `${sx},${sy} ${ex},${sy} ${ex},${ey}`;
            }
        };

        const normalizeSegment = (segment) => {
            const normalized = { ...segment };
            if (normalized.orientation === 'H' && normalized.x1 > normalized.x2) {
                [normalized.x1, normalized.x2] = [normalized.x2, normalized.x1];
            }
            if (normalized.orientation === 'V' && normalized.y1 > normalized.y2) {
                [normalized.y1, normalized.y2] = [normalized.y2, normalized.y1];
            }
            return normalized;
        };

        const getWireSegments = (wire) => {
            const routeType = wire.routeType || 'HV';
            const side = wire.side || 'back';
            const x1 = wire.startX;
            const y1 = wire.startY;
            const x2 = wire.endX;
            const y2 = wire.endY;
            const segments = [];

            // シンプルな直線ワイヤー（ルートなし）の場合
            if (x1 === x2 || y1 === y2) {
                segments.push(normalizeSegment({ wireId: wire.id, side, 
                    orientation: x1 === x2 ? 'V' : 'H', 
                    x1, y1, x2, y2 }));
            } else if (routeType === 'VH') {
                // 最初に垂直、次に水平
                const vSegment = normalizeSegment({ wireId: wire.id, side, orientation: 'V', x1, y1, x2: x1, y2 });
                if (vSegment.y1 !== vSegment.y2) segments.push(vSegment);
                const hSegment = normalizeSegment({ wireId: wire.id, side, orientation: 'H', x1: x1, y1: y2, x2, y2 });
                if (hSegment.x1 !== hSegment.x2) segments.push(hSegment);
            } else {
                // 最初に水平、次に垂直（HVがデフォルト）
                const hSegment = normalizeSegment({ wireId: wire.id, side, orientation: 'H', x1, y1, x2, y2: y1 });
                if (hSegment.x1 !== hSegment.x2) segments.push(hSegment);
                const vSegment = normalizeSegment({ wireId: wire.id, side, orientation: 'V', x1: x2, y1, x2, y2 });
                if (vSegment.y1 !== vSegment.y2) segments.push(vSegment);
            }

            return segments;
        };

        const getComponentPinCoords = (comp, gridSize) => {
            const pinOffsets = getComponentPinOffsets(comp.type, comp.width, comp.height);
            const baseX = comp.gridX || 0;  // グリッド座標を直接使用
            const baseY = comp.gridY || 0;
            const rotation = comp.rotation || 0;
            return pinOffsets.map(p => {
                let rx = p.x;
                let ry = p.y;
                if (rotation === 90) { rx = -p.y; ry = p.x; }
                else if (rotation === 180) { rx = -p.x; ry = -p.y; }
                else if (rotation === 270) { rx = p.y; ry = -p.x; }
                return { x: baseX + rx, y: baseY + ry };
            });
        };

        // 部品ピン・配線端点・接続点が占める範囲（グリッド座標）。何もなければ null
        const getContentBounds = (components, wires, gridSize, junctions = []) => {
            const points = [];
            components.forEach(comp => points.push(...getComponentPinCoords(comp, gridSize)));
            wires.forEach(w => points.push({ x: w.startX, y: w.startY }, { x: w.endX, y: w.endY }));
            junctions.forEach(j => points.push({ x: j.x, y: j.y }));
            if (points.length === 0) return null;
            return {
                minX: Math.min(...points.map(p => p.x)),
                minY: Math.min(...points.map(p => p.y)),
                maxX: Math.max(...points.map(p => p.x)),
                maxY: Math.max(...points.map(p => p.y))
            };
        };

        const isInsideBoard = (p, boardConfig) => p.x >= 0 && p.y >= 0 && p.x <= boardConfig.width && p.y <= boardConfig.height;

        // 配線が通る穴を始点から順に列挙する（両端は kind: 'end'、それ以外は 'mid'）
        // dir はその穴での配線の向き（'H' / 'V'、曲がり角は 'HV'）
        const getWireHoles = (wire) => {
            const x1 = wire.startX, y1 = wire.startY, x2 = wire.endX, y2 = wire.endY;
            const corner = wire.routeType === 'VH' ? { x: x1, y: y2 } : { x: x2, y: y1 };
            const points = [{ x: x1, y: y1, dir: x1 === corner.x && y1 === corner.y ? (y1 === y2 ? 'H' : 'V') : (x1 === corner.x ? 'V' : 'H') }];
            const walk = (from, to) => {
                const dx = Math.sign(to.x - from.x);
                const dy = Math.sign(to.y - from.y);
                let x = from.x, y = from.y;
                while (x !== to.x || y !== to.y) {
                    x += dx; y += dy;
                    points.push({ x, y, dir: dx !== 0 ? 'H' : 'V' });
                }
            };
            walk({ x: x1, y: y1 }, corner);
            const cornerIndex = points.length - 1;
            walk(corner, { x: x2, y: y2 });
            const isBent = x1 !== x2 && y1 !== y2;
            return points.map((p, i) => ({
                ...p,
                dir: isBent && i === cornerIndex ? 'HV' : p.dir,
                kind: i === 0 || i === points.length - 1 ? 'end' : 'mid'
            }));
        };

        // 接続判定のルール:
        //   はんだ付けされる点 = 配線の端点 と 接続点（ジャンクション）
        //   はんだ付けされる穴では、ピン・その穴を端点とする配線（両面）・その穴を通過する裏面の配線がつながる
        //   表面の配線の通過は、同じ穴に表面の端点がある（T字）か接続点がある場合のみつながる
        //   はんだ付けされない穴での通過・交差はつながらない
        const buildConnectionGraph = (components, wires, boardConfig, junctions = []) => {
            const nodes = [];
            const edges = [];
            const addNode = (x, y, side, type, meta = {}) => {
                const id = `n${nodes.length}`;
                nodes.push({ id, x, y, side, type, meta });
                return id;
            };

            const holes = new Map();
            const getHole = (x, y) => {
                const key = `${x},${y}`;
                if (!holes.has(key)) holes.set(key, { pins: [], ends: [], mids: [], junction: null });
                return holes.get(key);
            };

            wires.forEach(wire => {
                const side = wire.side || 'back';
                const startId = addNode(wire.startX, wire.startY, side, 'wire-end', { wireId: wire.id, end: 'start' });
                const endId = addNode(wire.endX, wire.endY, side, 'wire-end', { wireId: wire.id, end: 'end' });
                const pathIds = [startId];
                if (wire.startX !== wire.endX && wire.startY !== wire.endY) {
                    const cornerX = wire.routeType === 'VH' ? wire.startX : wire.endX;
                    const cornerY = wire.routeType === 'VH' ? wire.endY : wire.startY;
                    pathIds.push(addNode(cornerX, cornerY, side, 'wire-bend', { wireId: wire.id }));
                }
                pathIds.push(endId);
                for (let i = 0; i < pathIds.length - 1; i++) {
                    edges.push({ id: `e${edges.length}`, from: pathIds[i], to: pathIds[i + 1], wireId: wire.id, side });
                }

                getHole(wire.startX, wire.startY).ends.push({ nodeId: startId, side });
                getHole(wire.endX, wire.endY).ends.push({ nodeId: endId, side });
                getWireHoles(wire).filter(p => p.kind === 'mid').forEach(p => {
                    getHole(p.x, p.y).mids.push({ nodeId: startId, side });
                });
            });

            components.forEach(comp => {
                getComponentPinCoords(comp, boardConfig.gridSize).forEach((pin, index) => {
                    const nodeId = addNode(pin.x, pin.y, 'both', 'pin', { componentId: comp.id, pinIndex: index });
                    getHole(pin.x, pin.y).pins.push(nodeId);
                });
            });

            junctions.forEach(j => {
                const nodeId = addNode(j.x, j.y, 'both', 'junction', { junctionId: j.id });
                getHole(j.x, j.y).junction = nodeId;
            });

            const parent = new Map();
            const find = (id) => {
                const root = parent.get(id);
                if (root === id) return id;
                const resolved = find(root);
                parent.set(id, resolved);
                return resolved;
            };
            const union = (a, b) => {
                const rootA = find(a);
                const rootB = find(b);
                if (rootA !== rootB) parent.set(rootB, rootA);
            };

            nodes.forEach(node => parent.set(node.id, node.id));
            edges.forEach(edge => union(edge.from, edge.to));

            // 接続点を打たなくても端点で自動的に接続される穴（表示用）
            const autoConnectionPoints = [];
            holes.forEach((hole, key) => {
                if (!hole.junction && hole.ends.length === 0) return;
                const members = [...hole.ends.map(e => e.nodeId), ...hole.pins];
                if (hole.junction) members.push(hole.junction);
                hole.mids.forEach(m => {
                    if (hole.junction || m.side === 'back' || hole.ends.some(e => e.side === m.side)) members.push(m.nodeId);
                });
                members.slice(1).forEach(id => union(members[0], id));

                // 端点があり、ピン・配線が2つ以上つながる穴
                const conductorCount = members.length - (hole.junction ? 1 : 0);
                if (!hole.junction && conductorCount >= 2) {
                    const [x, y] = key.split(',').map(Number);
                    autoConnectionPoints.push({ x, y });
                }
            });

            const netsMap = new Map();
            nodes.forEach(node => {
                const root = find(node.id);
                if (!netsMap.has(root)) netsMap.set(root, []);
                netsMap.get(root).push(node.id);
            });

            const nets = Array.from(netsMap.entries()).map(([rootId, nodeIds], index) => ({
                id: `net${index}`,
                rootId,
                nodeIds
            }));

            return { nodes, edges, nets, autoConnectionPoints };
        };

        // 旧形式（接続点なし）のファイル用: 以前は裏面の配線がピン上を通過・交差するだけで接続していたため、
        // その箇所に接続点を打って接続を保つ
        const migrateLegacyJunctions = (components, wires, gridSize) => {
            const pinKeys = new Set();
            components.forEach(comp => getComponentPinCoords(comp, gridSize).forEach(p => pinKeys.add(`${p.x},${p.y}`)));
            const endKeys = new Set();
            wires.forEach(w => endKeys.add(`${w.startX},${w.startY}`).add(`${w.endX},${w.endY}`));
            const backMids = new Map(); // 穴 -> その穴を通過する裏面配線の向きの一覧
            wires.filter(w => (w.side || 'back') === 'back').forEach(w => {
                getWireHoles(w).filter(p => p.kind === 'mid').forEach(p => {
                    const key = `${p.x},${p.y}`;
                    if (!backMids.has(key)) backMids.set(key, []);
                    backMids.get(key).push(p.dir);
                });
            });
            // 向きの異なる配線同士の交差（同一直線上の重なりは端点同士で接続されるので対象外）
            const isCrossing = (dirs) => dirs.some((a, i) => dirs.some((b, j) => i !== j && (a.includes('H') && b.includes('V'))));
            const junctions = [];
            backMids.forEach((dirs, key) => {
                // 端点がある穴は新ルールでも接続されるので不要
                if (endKeys.has(key)) return;
                if (pinKeys.has(key) || isCrossing(dirs)) {
                    const [x, y] = key.split(',').map(Number);
                    junctions.push({ id: Math.random().toString(36).substr(2, 9), x, y });
                }
            });
            return junctions;
        };

        const NET_COLORS = ['#ef4444', '#f59e0b', '#10b981', '#3b82f6', '#8b5cf6', '#ec4899', '#f97316', '#06b6d4', '#84cc16', '#d946ef'];

        const getNetColor = (netIndex) => {
            return NET_COLORS[netIndex % NET_COLORS.length];
        };

        const getNetDetails = (netId, connectionGraph, comps) => {
            const net = connectionGraph.nets?.find(n => n.id === netId);
            if (!net) return null;

            const nodes = net.nodeIds.map(nodeId => connectionGraph.nodes?.find(n => n.id === nodeId)).filter(Boolean);
            const pinNodes = nodes.filter(n => n.type === 'pin');
            const wireNodes = nodes.filter(n => n.type === 'wire-end' || n.type === 'junction' || n.type === 'wire-bend');

            const componentMap = new Map();
            pinNodes.forEach(pin => {
                const compId = pin.meta?.componentId;
                if (compId) {
                    if (!componentMap.has(compId)) componentMap.set(compId, []);
                    componentMap.get(compId).push(pin.meta?.pinIndex || 0);
                }
            });

            const netNodeIds = new Set(net.nodeIds);
            const wireIds = new Set();
            (connectionGraph.edges || []).forEach(edge => {
                if (netNodeIds.has(edge.from)) wireIds.add(edge.wireId);
            });

            return {
                netId,
                nodeCount: net.nodeIds.length,
                pinCount: pinNodes.length,
                wireNodeCount: wireNodes.length,
                wireCount: wireIds.size,
                components: Array.from(componentMap.entries()).map(([compId, pins]) => {
                    const comp = comps?.find(c => c.id === compId);
                    const compName = comp?.name || compId;
                    const compValue = comp?.value ? ` (${comp.value})` : '';
                    return { compId, compName: compName + compValue, pins };
                }),
                wires: Array.from(wireIds)
            };
        };

        const buildNetToWireMap = (connectionGraph, wires) => {
            const netToWires = new Map();
            if (!connectionGraph.nets) return netToWires;

            // 同じ座標のノードは先に登録されたワイヤのmetaしか持たないため、エッジのwireIdで判定する
            const nodeToNet = new Map();
            connectionGraph.nets.forEach(net => net.nodeIds.forEach(nodeId => nodeToNet.set(nodeId, net.id)));
            const netWireIds = new Map();
            (connectionGraph.edges || []).forEach(edge => {
                const netId = nodeToNet.get(edge.from);
                if (!netWireIds.has(netId)) netWireIds.set(netId, new Set());
                netWireIds.get(netId).add(edge.wireId);
            });

            connectionGraph.nets.forEach((net, netIndex) => {
                const wireIds = netWireIds.get(net.id) || new Set();
                netToWires.set(net.id, { wires: Array.from(wireIds), color: getNetColor(netIndex) });
            });
            return netToWires;
        };

        const validateConnectionGraph = (connectionGraph, wires) => {
            const issues = [];

            if (!connectionGraph.nets || connectionGraph.nets.length === 0) {
                return { issues: [], stats: { totalNets: 0, connectedNets: 0, disconnectedWires: 0 } };
            }

            const wireNodeMap = new Map();
            wires.forEach(wire => {
                if (!wireNodeMap.has(wire.id)) wireNodeMap.set(wire.id, new Set());
            });

            connectionGraph.nodes.forEach(node => {
                if (node.meta?.wireId) {
                    wireNodeMap.get(node.meta.wireId)?.add(node.id);
                }
            });

            const netsWithWires = new Map();
            connectionGraph.nets.forEach(net => {
                const wireSet = new Set();
                net.nodeIds.forEach(nodeId => {
                    const node = connectionGraph.nodes.find(n => n.id === nodeId);
                    if (node?.meta?.wireId) {
                        wireSet.add(node.meta.wireId);
                    }
                });
                if (wireSet.size > 0) {
                    netsWithWires.set(net.id, wireSet);
                }
            });

            connectionGraph.nets.forEach(net => {
                const hasPins = net.nodeIds.some(nodeId => {
                    const node = connectionGraph.nodes.find(n => n.id === nodeId);
                    return node?.type === 'pin';
                });
                const hasWires = net.nodeIds.some(nodeId => {
                    const node = connectionGraph.nodes.find(n => n.id === nodeId);
                    return node?.type === 'wire-end' || node?.type === 'wire-bend';
                });

                if (hasWires && !hasPins) {
                    issues.push({
                        type: 'floating-wire',
                        severity: 'warning',
                        netId: net.id,
                        nodeCount: net.nodeIds.length,
                        message: `ネット${net.id.replace('net', '')}: 部品に接続されていないワイヤがあります`
                    });
                }

                if (net.nodeIds.length === 1 && hasWires) {
                    issues.push({
                        type: 'isolated-node',
                        severity: 'warning',
                        netId: net.id,
                        message: `ネット${net.id.replace('net', '')}: 孤立したワイヤエンドポイント`
                    });
                }

                if (net.nodeIds.length === 1) {
                    const node = connectionGraph.nodes.find(n => n.id === net.nodeIds[0]);
                    if (node?.type === 'junction') {
                        issues.push({
                            type: 'unused-junction',
                            severity: 'warning',
                            netId: net.id,
                            message: `接続点 (${node.x},${node.y}) に何もつながっていません`
                        });
                    }
                }
            });

            // 同じ面の他のワイヤに完全に重なっているワイヤ（削除しても接続は変わらない）
            const isZeroLength = (w) => w.startX === w.endX && w.startY === w.endY;
            const segmentsByWire = wires.map(w => isZeroLength(w) ? [] : getWireSegments(w));
            const isCoveredBy = (segments, other) => segments.every(s => other.some(o =>
                o.orientation === s.orientation &&
                (s.orientation === 'H'
                    ? o.y1 === s.y1 && o.x1 <= s.x1 && s.x2 <= o.x2
                    : o.x1 === s.x1 && o.y1 <= s.y1 && s.y2 <= o.y2)
            ));
            wires.forEach((wire, i) => {
                if (segmentsByWire[i].length === 0) return;
                const side = wire.side || 'back';
                const coveringIndex = wires.findIndex((other, j) => {
                    if (j === i || segmentsByWire[j].length === 0 || (other.side || 'back') !== side) return false;
                    if (!isCoveredBy(segmentsByWire[i], segmentsByWire[j])) return false;
                    // 完全に同一のワイヤ同士は後ろの方だけを重複として報告する
                    return !isCoveredBy(segmentsByWire[j], segmentsByWire[i]) || j < i;
                });
                if (coveringIndex !== -1) {
                    issues.push({
                        type: 'duplicate-wire',
                        severity: 'warning',
                        wireId: wire.id,
                        message: `${side === 'front' ? '表面' : '裏面'}のワイヤ (${wire.startX},${wire.startY})→(${wire.endX},${wire.endY}) は他のワイヤと重複しています`
                    });
                }
            });

            const nodeToNet = new Map();
            connectionGraph.nets.forEach(net => net.nodeIds.forEach(nodeId => nodeToNet.set(nodeId, net.id)));
            const pinNets =new Set(connectionGraph.nodes.filter(n => n.type === 'pin').map(n => nodeToNet.get(n.id)));

            return {
                issues,
                stats: {
                    totalNets: connectionGraph.nets.length,
                    connectedNets: pinNets.size,
                    // ワイヤの属するネット（エッジから判定）に部品ピンが1つもないものを数える
                    disconnectedWires: wires.filter(w =>
                        !connectionGraph.edges.some(e => e.wireId === w.id && pinNets.has(nodeToNet.get(e.from)))
                    ).length
                }
            };
        };

        const COMPONENT_DEFINITIONS = {
            RESISTOR: {
                id: 'resistor',
                name: '抵抗',
                defaultWidth: 3,
                defaultHeight: 1,
                render: (w, h, gridSize, gridW, gridH) => {
                    const padLeft = gridSize / 2;
                    const padRight = w - gridSize / 2;
                    if (gridW < 2) return null;
                    const innerDist = padRight - padLeft;
                    const bodyWidth = innerDist * 0.6;
                    const leadLen = (innerDist - bodyWidth) / 2;
                    const bodyStart = padLeft + leadLen;
                    const bodyEnd = padRight - leadLen;
                    return (
                        <g>
                            <line x1={padLeft} y1={gridSize / 2} x2={bodyStart} y2={gridSize / 2} stroke="#ccc" strokeWidth="2" />
                            <circle cx={padLeft} cy={gridSize / 2} r={2} fill="#9ca3af" />
                            <line x1={bodyEnd} y1={gridSize / 2} x2={padRight} y2={gridSize / 2} stroke="#ccc" strokeWidth="2" />
                            <circle cx={padRight} cy={gridSize / 2} r={2} fill="#9ca3af" />
                            <rect x={bodyStart} y={gridSize / 4} width={bodyWidth} height={gridSize / 2} fill="#e5e7eb" stroke="#4b5563" rx="3" />
                            <line x1={bodyStart + bodyWidth * 0.3} y1={gridSize / 4} x2={bodyStart + bodyWidth * 0.3} y2={gridSize * 0.75} stroke="brown" strokeWidth="2" />
                            <line x1={bodyStart + bodyWidth * 0.5} y1={gridSize / 4} x2={bodyStart + bodyWidth * 0.5} y2={gridSize * 0.75} stroke="red" strokeWidth="2" />
                            <line x1={bodyStart + bodyWidth * 0.7} y1={gridSize / 4} x2={bodyStart + bodyWidth * 0.7} y2={gridSize * 0.75} stroke="gold" strokeWidth="2" />
                        </g>
                    );
                }
            },
            CAPACITOR: {
                id: 'capacitor',
                name: 'コンデンサ',
                defaultWidth: 2,
                defaultHeight: 1,
                render: (w, h, gridSize, gridW, gridH, viewSide, comp) => {
                    const padLeft = gridSize / 2;
                    const padRight = w - gridSize / 2;
                    const gap = Math.min(gridSize * 0.4, (padRight - padLeft) * 0.4);
                    const isPolarized = comp?.isPolarized;

                    return (
                        <g>
                            <line x1={padLeft} y1={gridSize / 2} x2={w / 2 - gap} y2={gridSize / 2} stroke="#ccc" strokeWidth="2" />
                            <circle cx={padLeft} cy={gridSize / 2} r={2} fill="#9ca3af" />
                            <line x1={w / 2 + gap} y1={gridSize / 2} x2={padRight} y2={gridSize / 2} stroke="#ccc" strokeWidth="2" />
                            <circle cx={padRight} cy={gridSize / 2} r={2} fill="#9ca3af" />
                            <circle cx={w / 2} cy={gridSize / 2} r={Math.min(gridSize / 2.5, (padRight - padLeft) / 2)} fill={isPolarized ? '#000000' : '#3b82f6'} stroke={isPolarized ? '#000000' : '#1d4ed8'} />
                            {isPolarized && (
                                <text x={padLeft + 4} y={gridSize / 2 - 4} fontSize={gridSize * 0.4} fill="#ef4444" fontWeight="bold">+</text>
                            )}
                        </g>
                    );
                }
            },
            IC_DIP: {
                id: 'ic_dip',
                name: 'IC',
                defaultWidth: 4,
                defaultHeight: 4,
                render: (w, h, gridSize, gridW, gridH) => {
                    const padX = Math.min(gridSize / 2, w / 4);
                    const padY = Math.min(gridSize / 2, h / 4);
                    const topPinCenterY = gridSize / 2;
                    const bottomPinCenterY = h - gridSize / 2;
                    const pinH = gridSize / 2;
                    const pinW = 4;
                    const bodyX = padX;
                    const bodyY = topPinCenterY + 2;
                    const bodyW = w - padX * 2;
                    const bodyH = (bottomPinCenterY - 2) - bodyY;
                    const pins = [];
                    for (let i = 0; i < gridW; i++) {
                        const pinCenterX = gridSize * (i + 0.5);
                        pins.push(
                            <React.Fragment key={i}>
                                <rect x={pinCenterX - pinW / 2} y={topPinCenterY - pinH / 2} width={pinW} height={pinH} fill="#9ca3af" />
                                <circle cx={pinCenterX} cy={topPinCenterY} r={1.5} fill="#6b7280" />
                                <rect x={pinCenterX - pinW / 2} y={bottomPinCenterY - pinH / 2} width={pinW} height={pinH} fill="#9ca3af" />
                                <circle cx={pinCenterX} cy={bottomPinCenterY} r={1.5} fill="#6b7280" />
                            </React.Fragment>
                        );
                    }
                    return (
                        <g>
                            <rect x={bodyX} y={bodyY} width={bodyW} height={bodyH} fill="#1f2937" rx="2" />
                            <path d={`M ${bodyX} ${h / 2 - 5} Q ${bodyX + 5} ${h / 2} ${bodyX} ${h / 2 + 5}`} fill="#374151" stroke="none" />
                            {pins}
                        </g>
                    );
                }
            },
            GENERAL: {
                id: 'general',
                name: '汎用部品',
                defaultWidth: 3,
                defaultHeight: 1,
                render: (w, h, gridSize, gridW, gridH, viewSide) => {
                    const pins = [];
                    for (let y = 0; y < gridH; y++) {
                        for (let x = 0; x < gridW; x++) {
                            const cx = x * gridSize + gridSize / 2;
                            const cy = y * gridSize + gridSize / 2;
                            pins.push(
                                <circle
                                    key={`${x}-${y}`}
                                    cx={cx} cy={cy} r={3}
                                    fill="#9ca3af" stroke="#4b5563" strokeWidth={1}
                                />
                            );
                        }
                    }
                    const padding = 2;
                    return (
                        <g>
                            <rect x={padding} y={padding} width={w - padding * 2} height={h - padding * 2} fill="#8b5cf6" stroke="#6d28d9" strokeWidth="2" rx="4" />
                            {viewSide !== 'front' && pins}
                        </g>
                    );
                }
            },
            JUMPER: {
                id: 'jumper',
                name: 'ピンヘッダ',
                defaultWidth: 4,
                defaultHeight: 1,
                render: (w, h, gridSize, gridW, gridH, viewSide, comp) => {
                    const pins = [];
                    for (let y = 0; y < gridH; y++) {
                        for (let x = 0; x < gridW; x++) {
                            const labelIndex = y * gridW + x;
                            const label = comp?.pinLabels?.[labelIndex] || '';
                            const cx = x * gridSize + gridSize / 2;
                            const cy = y * gridSize + gridSize / 2;
                            pins.push(
                                <g key={`${x}-${y}`}>
                                    <rect
                                        x={x * gridSize + 2} y={y * gridSize + 2}
                                        width={gridSize - 4} height={gridSize - 4}
                                        fill="gold" stroke="orange" strokeWidth="1"
                                    />
                                    {label && (
                                        <text
                                            x={cx}
                                            y={cy}
                                            textAnchor="middle"
                                            dominantBaseline="middle"
                                            fontSize={Math.max(8, gridSize * 0.35)}
                                            fill="#111827"
                                            className="select-none"
                                            style={{ pointerEvents: 'none' }}
                                        >
                                            {label}
                                        </text>
                                    )}
                                </g>
                            );
                        }
                    }
                    return <g>{pins}</g>;
                }
            }
        };

        const WIRE_COLORS = [
            { name: '赤', value: '#ef4444' },
            { name: '黒', value: '#1f2937' },
            { name: '青', value: '#3b82f6' },
            { name: '黄', value: '#eab308' },
            { name: '緑', value: '#22c55e' },
            { name: '白', value: '#f3f4f6' },
        ];

        const DEFAULT_WIRE_COLORS = {
            front: '#3b82f6', // 青
            back: '#eab308'   // 黄
        };

        // --- ボードレンダリングコンポーネント (抽出) ---
        const BoardRenderer = ({
            boardConfig,
            components,
            wires,
            junctions = [],
            viewSide,
            showLabels,
            wireColors,
            selectedItem, // optional
            selectedTool, // optional
            hoveredGrid, // optional
            currentWireStart, // optional
            currentWireRouteType, // optional
            onMouseDown, // optional
            onMouseMove, // optional
            onMouseUp, // optional
            onMouseLeave, // optional
            handleComponentDragStart, // optional
            handleWireEndpointDragStart, // optional
            handleWireClick, // optional
            handleJunctionMouseDown, // optional
            handleDeviceDown, // optional
            isPrintMode = false,
            connectionGraph = { nodes: [], edges: [], nets: [] }, // optional
            showConnectionDebug = false, // optional
            netToWireMap = new Map(), // optional
            useNetColorMode = false // optional
        }) => {
            const totalBoardWidth = boardConfig.width * boardConfig.gridSize + boardConfig.gridSize;
            const totalBoardHeight = boardConfig.height * boardConfig.gridSize + boardConfig.gridSize;

            // Print Modeのときはイベントハンドラを無効化
            const events = isPrintMode ? {} : {
                onMouseDown, onMouseMove, onMouseUp, onMouseLeave,
                onTouchStart: (e) => handleDeviceDown && handleDeviceDown(e, 'board')
            };

            const renderGridHoles = () => {
                const holes = [];
                for (let y = 0; y <= boardConfig.height; y++) {
                    for (let x = 0; x <= boardConfig.width; x++) {
                        holes.push(
                            <circle key={`${x}-${y}`} cx={x * boardConfig.gridSize} cy={y * boardConfig.gridSize} r={HOLE_RADIUS} fill="#1f2937" opacity={0.3} style={{ pointerEvents: 'none' }} />
                        );
                    }
                }
                return holes;
            };

            // current selection logic for highlighting
            const currentSelectedWire = selectedItem?.type === 'wire' ? wires.find(w => w.id === selectedItem.id) : null;

            return (
                <svg width={totalBoardWidth} height={totalBoardHeight} {...events} className="block touch-none" style={{ backgroundColor: '#2d7a4d' }}>
                    <defs>
                        <pattern id="grid" width={boardConfig.gridSize} height={boardConfig.gridSize} patternUnits="userSpaceOnUse"><circle cx={boardConfig.gridSize / 2} cy={boardConfig.gridSize / 2} r={1} fill="#e5e7eb" opacity="0.5" /></pattern>
                    </defs>
                    <g transform={viewSide === 'back' ? `scale(-1, 1) translate(-${totalBoardWidth}, 0)` : ''}>
                        <g>{renderGridHoles()}</g>

                        {!isPrintMode && (selectedTool === 'wire' || selectedTool === 'junction') && hoveredGrid && (
                            <g className="pointer-events-none">
                                <circle cx={hoveredGrid.x * boardConfig.gridSize} cy={hoveredGrid.y * boardConfig.gridSize} r={boardConfig.gridSize / 2.5} fill={selectedTool === 'junction' ? '#f8fafc' : wireColors[viewSide]} opacity={0.3} />
                                <circle cx={hoveredGrid.x * boardConfig.gridSize} cy={hoveredGrid.y * boardConfig.gridSize} r={2} fill="white" />
                            </g>
                        )}

                        {[viewSide === 'back' ? 'components' : 'wires', viewSide === 'back' ? 'wires' : 'components'].map(layer => {
                            if (layer === 'wires') {
                                return (
                                    <g key="wires" className="wires">
                                        {wires.map(wire => {
                                            const wireSide = wire.side || 'back';
                                            const isActiveSide = wireSide === viewSide;
                                            const isSelected = !isPrintMode && isActiveSide && selectedItem?.type === 'wire' && selectedItem.id === wire.id;
                                            const routeType = wire.routeType || 'HV';
                                            const points = calculateWirePoints(wire.startX, wire.startY, wire.endX, wire.endY, routeType, boardConfig.gridSize);

                                            let displayColor = wire.color;
                                            if (useNetColorMode && netToWireMap.size > 0) {
                                                for (const [netId, netInfo] of netToWireMap.entries()) {
                                                    if (netInfo.wires.includes(wire.id)) {
                                                        displayColor = netInfo.color;
                                                        break;
                                                    }
                                                }
                                            }

                                            // Print Mode: show all wires but dim inactive side ones differently?
                                            // Requirements say: Page 2 Top=Front, Bottom=Back.
                                            // For Front View: Show Front Wires clearly, Back Wires maybe dim or hidden? Usually we only show the side's wires or "through" view.
                                            // Let's stick to current logic: Non-active side wires are ghosted.

                                            const opacity = isActiveSide ? 0.9 : 0.15;
                                            const pointerEvents = !isPrintMode && isActiveSide ? 'auto' : 'none';

                                            return (
                                                <g key={wire.id} onClick={(e) => { if (!isPrintMode && handleWireClick) handleWireClick(e, wire.id); }} className={!isPrintMode ? "cursor-pointer" : ""} style={{ opacity, pointerEvents }}>
                                                    <polyline points={points} stroke="transparent" fill="none" strokeWidth={boardConfig.gridSize / 2} />
                                                    <polyline points={points} stroke={displayColor} fill="none" strokeWidth={Math.max(2, boardConfig.gridSize * 0.15)} strokeLinecap="round" strokeLinejoin="round" />
                                                    {isSelected && <polyline points={points} stroke="white" fill="none" strokeWidth={1} strokeDasharray="2,2" />}
                                                </g>
                                            );
                                        })}
                                        {/* 始点はカーソルが基板外にあっても表示し続ける（見えないまま残るのを防ぐ） */}
                                        {!isPrintMode && currentWireStart && (
                                            <g className="pointer-events-none">
                                                {hoveredGrid && (
                                                    <polyline
                                                        points={calculateWirePoints(currentWireStart.x, currentWireStart.y, hoveredGrid.x, hoveredGrid.y, currentWireRouteType, boardConfig.gridSize)}
                                                        stroke={wireColors[viewSide]}
                                                        fill="none"
                                                        strokeWidth={Math.max(2, boardConfig.gridSize * 0.15)}
                                                        strokeLinecap="round"
                                                        strokeLinejoin="round"
                                                        opacity={0.6}
                                                        strokeDasharray="4,4"
                                                    />
                                                )}
                                                <circle cx={currentWireStart.x * boardConfig.gridSize} cy={currentWireStart.y * boardConfig.gridSize} r={4} fill={wireColors[viewSide]} stroke="white" strokeWidth={1} />
                                            </g>
                                        )}
                                    </g>
                                );
                            } else {
                                return (
                                    <g key="components" className="components" style={{ opacity: viewSide === 'back' ? 0.3 : 1 }}>
                                        {components.map(comp => {
                                            const def = Object.values(COMPONENT_DEFINITIONS).find(t => t.id === comp.type);
                                            const isSelected = !isPrintMode && selectedItem?.type === 'component' && selectedItem.id === comp.id;
                                            const offsetX = -boardConfig.gridSize / 2;
                                            const offsetY = -boardConfig.gridSize / 2;
                                            const w = comp.width * boardConfig.gridSize;
                                            const h = comp.height * boardConfig.gridSize;
                                            const labelTransform = viewSide === 'back' ? `scale(-1, 1)` : '';
                                            // gridX, gridY をピクセル座標に変換
                                            const pixelX = (comp.gridX || 0) * boardConfig.gridSize;
                                            const pixelY = (comp.gridY || 0) * boardConfig.gridSize;
                                            return (
                                                <g key={comp.id} transform={`translate(${pixelX + offsetX}, ${pixelY + offsetY}) rotate(${comp.rotation}, ${boardConfig.gridSize / 2}, ${boardConfig.gridSize / 2})`} onMouseDown={(e) => { if (!isPrintMode && handleComponentDragStart) handleComponentDragStart(e, comp.id); }} onTouchStart={(e) => { if (!isPrintMode && handleDeviceDown) handleDeviceDown(e, 'component', comp.id); }} className={!isPrintMode ? "cursor-move" : ""} style={{ filter: isSelected ? 'drop-shadow(0 0 2px white)' : 'none', pointerEvents: isPrintMode ? 'none' : 'auto' }}>
                                                    {isSelected && <rect x={-2} y={-2} width={w + 4} height={h + 4} fill="none" stroke="#6366f1" strokeWidth="1" strokeDasharray="2,2" rx="2" />}
                                                    {def.render(w, h, boardConfig.gridSize, comp.width, comp.height, viewSide, comp)}

                                                </g>
                                            );
                                        })}
                                    </g>
                                );
                            }
                        })}

                        {showLabels && (
                            <g className="component-labels" style={{ pointerEvents: 'none' }}>
                                {components.map(comp => {
                                    const offsetX = -boardConfig.gridSize / 2;
                                    const offsetY = -boardConfig.gridSize / 2;
                                    const w = comp.width * boardConfig.gridSize;
                                    const h = comp.height * boardConfig.gridSize;
                                    const labelTransform = viewSide === 'back' ? `scale(-1, 1)` : '';
                                    // gridX, gridY をピクセル座標に変換
                                    const pixelX = (comp.gridX || 0) * boardConfig.gridSize;
                                    const pixelY = (comp.gridY || 0) * boardConfig.gridSize;

                                    return (
                                        <g key={comp.id} transform={`translate(${pixelX + offsetX}, ${pixelY + offsetY}) rotate(${comp.rotation}, ${boardConfig.gridSize / 2}, ${boardConfig.gridSize / 2})`}>
                                            <g transform={`rotate(${-comp.rotation}, ${w / 2}, ${h / 2})`}>
                                                <g transform={`translate(${w / 2}, ${h / 2})`}>
                                                    <g transform={labelTransform}>
                                                        <text x={0} y={0} textAnchor="middle" dominantBaseline="middle" fontSize={Math.max(10, boardConfig.gridSize * 0.5)} fill="white" className="font-bold drop-shadow-md select-none" style={{ textShadow: '0px 0px 3px rgba(0,0,0,0.9)' }}>{comp.name}</text>
                                                        {comp.value && (
                                                            <text x={0} y={Math.max(10, boardConfig.gridSize * 0.5)} textAnchor="middle" dominantBaseline="middle" fontSize={Math.max(8, boardConfig.gridSize * 0.4)} fill="#eee" className="drop-shadow-md select-none" style={{ textShadow: '0px 0px 3px rgba(0,0,0,0.9)' }}>{comp.value}</text>
                                                        )}
                                                    </g>
                                                </g>
                                            </g>
                                        </g>
                                    );
                                })}
                            </g>
                        )}

                        {/* 接続点（はんだで配線同士・配線とピンをつなぐ点）。端点で自動接続される穴も同じ見た目で表示する */}
                        <g className="junctions">
                            {(connectionGraph.autoConnectionPoints || []).map(p => (
                                <circle key={`auto-${p.x},${p.y}`} cx={p.x * boardConfig.gridSize} cy={p.y * boardConfig.gridSize} r={boardConfig.gridSize * 0.22} fill="#f8fafc" stroke="#111827" strokeWidth={1.5} style={{ pointerEvents: 'none' }} />
                            ))}
                            {junctions.map(j => {
                                const isSelected = !isPrintMode && selectedItem?.type === 'junction' && selectedItem.id === j.id;
                                return (
                                    <g key={j.id} onMouseDown={(e) => { if (!isPrintMode && handleJunctionMouseDown) handleJunctionMouseDown(e, j.id); }} className={!isPrintMode && selectedTool === 'select' ? 'cursor-pointer' : ''} style={{ pointerEvents: isPrintMode ? 'none' : 'auto' }}>
                                        <circle cx={j.x * boardConfig.gridSize} cy={j.y * boardConfig.gridSize} r={boardConfig.gridSize * 0.22} fill="#f8fafc" stroke="#111827" strokeWidth={1.5} />
                                        {isSelected && <circle cx={j.x * boardConfig.gridSize} cy={j.y * boardConfig.gridSize} r={boardConfig.gridSize * 0.38} fill="none" stroke="#6366f1" strokeWidth={1.5} strokeDasharray="2,2" />}
                                    </g>
                                );
                            })}
                        </g>

                        {/* 最前面UI（ワイヤー端点ハンドル） */}
                        {!isPrintMode && (
                            <g className="ui-overlay">
                                {currentSelectedWire && (
                                    <>
                                        <g className="cursor-move" onMouseDown={(e) => handleWireEndpointDragStart(e, currentSelectedWire.id, 'start')} onTouchStart={(e) => handleDeviceDown(e, 'wireEndpoint', { id: currentSelectedWire.id, type: 'start' })}>
                                            <circle cx={currentSelectedWire.startX * boardConfig.gridSize} cy={currentSelectedWire.startY * boardConfig.gridSize} r={boardConfig.gridSize / 2.5} fill="transparent" />
                                            <circle cx={currentSelectedWire.startX * boardConfig.gridSize} cy={currentSelectedWire.startY * boardConfig.gridSize} r={5} fill="white" stroke={currentSelectedWire.color} strokeWidth={2} />
                                        </g>
                                        <g className="cursor-move" onMouseDown={(e) => handleWireEndpointDragStart(e, currentSelectedWire.id, 'end')} onTouchStart={(e) => handleDeviceDown(e, 'wireEndpoint', { id: currentSelectedWire.id, type: 'end' })}>
                                            <circle cx={currentSelectedWire.endX * boardConfig.gridSize} cy={currentSelectedWire.endY * boardConfig.gridSize} r={boardConfig.gridSize / 2.5} fill="transparent" />
                                            <circle cx={currentSelectedWire.endX * boardConfig.gridSize} cy={currentSelectedWire.endY * boardConfig.gridSize} r={5} fill="white" stroke={currentSelectedWire.color} strokeWidth={2} />
                                        </g>
                                    </>
                                )}
                            </g>
                        )}

                        {/* 接続グラフのデバッグ可視化 */}
                        {!isPrintMode && showConnectionDebug && viewSide === 'front' && (
                            <g className="connection-debug" pointerEvents="none" opacity={0.6}>
                                {/* エッジ */}
                                {connectionGraph.edges && connectionGraph.edges.map(edge => {
                                    const fromNode = connectionGraph.nodes?.find(n => n.id === edge.from);
                                    const toNode = connectionGraph.nodes?.find(n => n.id === edge.to);
                                    if (!fromNode || !toNode) return null;
                                    return (
                                        <line key={edge.id} x1={fromNode.x * boardConfig.gridSize} y1={fromNode.y * boardConfig.gridSize} x2={toNode.x * boardConfig.gridSize} y2={toNode.y * boardConfig.gridSize} stroke="#888" strokeWidth={1} strokeDasharray="3,3" />
                                    );
                                })}
                                {/* ノード */}
                                {connectionGraph.nodes && connectionGraph.nodes.map(node => (
                                    <circle key={node.id} cx={node.x * boardConfig.gridSize} cy={node.y * boardConfig.gridSize} r={3} fill={node.type === 'pin' ? '#00ff00' : node.type === 'junction' ? '#ffaa00' : '#ff6b6b'} stroke="white" strokeWidth={1} />
                                ))}
                            </g>
                        )}
                    </g>
                </svg>
            );
        };

        // --- 印刷用レイアウトコンポーネント ---
        const PrintLayout = ({ components, wires, junctions, boardConfig, showLabels, wireColors, projectTitle }) => {
            const connectionGraph = buildConnectionGraph(components, wires, boardConfig, junctions);
            // BOM Summary Calculation
            const summary = components.reduce((acc, comp) => {
                const typeDef = COMPONENT_DEFINITIONS[comp.type.toUpperCase()];
                const typeName = typeDef ? typeDef.name : comp.type;
                const key = `${typeName} - ${comp.value || '(未指定)'}`;
                if (!acc[key]) acc[key] = { type: typeName, value: comp.value || '(未指定)', count: 0, refs: [] };
                acc[key].count++;
                acc[key].refs.push(comp.name);
                return acc;
            }, {});

            return (
                <div className="print-only font-sans text-gray-800">
                    {/* Page 1: Board Views */}
                    <div className="print-page flex flex-col p-8">
                        <h1 className="text-xl font-bold mb-4">{projectTitle} - 配線図</h1>

                        <div className="flex-1 flex flex-col gap-8 items-center">
                            <div className="flex flex-col items-center">
                                <h3 className="text-lg font-semibold mb-2">表面 (Front)</h3>
                                <div className="border border-gray-300">
                                    <BoardRenderer
                                        boardConfig={boardConfig}
                                        components={components}
                                        wires={wires}
                                        junctions={junctions}
                                        connectionGraph={connectionGraph}
                                        viewSide="front"
                                        showLabels={showLabels}
                                        wireColors={wireColors}
                                        isPrintMode={true}
                                    />
                                </div>
                            </div>

                            <hr className="w-full border-t border-dashed border-gray-300 my-4" />

                            <div className="flex flex-col items-center">
                                <h3 className="text-lg font-semibold mb-2">裏面 (Back)</h3>
                                <div className="border border-gray-300">
                                    <BoardRenderer
                                        boardConfig={boardConfig}
                                        components={components}
                                        wires={wires}
                                        junctions={junctions}
                                        connectionGraph={connectionGraph}
                                        viewSide="back"
                                        showLabels={showLabels}
                                        wireColors={wireColors}
                                        isPrintMode={true}
                                    />
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* Page 2: BOM */}
                    <div className="print-page flex flex-col p-8">
                        <h1 className="text-2xl font-bold mb-2">{projectTitle}</h1>
                        <h2 className="text-xl font-semibold mb-6 border-b pb-2">部品一覧表 (BOM)</h2>

                        {Object.keys(summary).length === 0 ? (
                            <p className="text-center text-gray-500 py-10">部品がありません</p>
                        ) : (
                            <table className="w-full text-left text-sm border-collapse border border-gray-300">
                                <thead>
                                    <tr className="bg-gray-100">
                                        <th className="p-3 border border-gray-300 font-semibold w-1/4">種類</th>
                                        <th className="p-3 border border-gray-300 font-semibold w-1/4">値/規格</th>
                                        <th className="p-3 border border-gray-300 font-semibold w-16 text-center">数量</th>
                                        <th className="p-3 border border-gray-300 font-semibold">参照名</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {Object.values(summary).sort((a, b) => a.type.localeCompare(b.type)).map((item, idx) => (
                                        <tr key={idx}>
                                            <td className="p-3 border border-gray-300">{item.type}</td>
                                            <td className="p-3 border border-gray-300">{item.value}</td>
                                            <td className="p-3 border border-gray-300 text-center">{item.count}</td>
                                            <td className="p-3 border border-gray-300 break-words">{item.refs.join(', ')}</td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        )}
                        <div className="mt-8 text-right text-sm">
                            合計部品数: {components.length}
                        </div>
                    </div>
                </div>
            );
        };

        // --- メインコンポーネント ---
        const UniversalBoardDesigner = () => {
            const [boardConfig, setBoardConfig] = useState({
                width: DEFAULT_BOARD_WIDTH,
                height: DEFAULT_BOARD_HEIGHT,
                pitch: DEFAULT_PITCH,
                gridSize: DEFAULT_GRID_SIZE
            });

            const [components, setComponents] = useState([]);
            const [wires, setWires] = useState([]);
            const [junctions, setJunctions] = useState([]); // 接続点 [{ id, x, y }]
            const [connectionGraph, setConnectionGraph] = useState({ nodes: [], edges: [], nets: [], autoConnectionPoints: [] });
            const [connectionValidation, setConnectionValidation] = useState({ issues: [], stats: { totalNets: 0, connectedNets: 0, disconnectedWires: 0 } });
            const [selectedTool, setSelectedTool] = useState('select');

            // 配線色の状態管理（面ごと）
            const [wireColors, setWireColors] = useState(DEFAULT_WIRE_COLORS);

            const [scale, setScale] = useState(1.5);
            const [currentWireStart, setCurrentWireStart] = useState(null);
            const [selectedItem, setSelectedItem] = useState(null);
            const [showLabels, setShowLabels] = useState(true);
            const [viewSide, setViewSide] = useState('front');

            const [componentSizes, setComponentSizes] = useState(() => {
                return Object.values(COMPONENT_DEFINITIONS).reduce((acc, def) => {
                    acc[def.id] = { width: def.defaultWidth, height: def.defaultHeight };
                    return acc;
                }, {});
            });

            const [activeSize, setActiveSize] = useState({ width: 0, height: 0 });
            const [draggedComponent, setDraggedComponent] = useState(null);
            const [draggedWireEndpoint, setDraggedWireEndpoint] = useState(null);
            const [hoveredGrid, setHoveredGrid] = useState(null);
            const [projectTitle, setProjectTitle] = useState('Untitled Project');
            const [showConnectionDebug, setShowConnectionDebug] = useState(false);
            const [useNetColorMode, setUseNetColorMode] = useState(false);
            const [selectedNetId, setSelectedNetId] = useState(null);

            // 作成中の配線ルートタイプ ('HV' | 'VH')
            const [currentWireRouteType, setCurrentWireRouteType] = useState('HV');

            // モーダル管理 { isOpen, type: 'alert'|'confirm'|'custom', message, title, children, onConfirm }
            const ModalStateInit = { isOpen: false, type: null, message: '', title: '', children: null, onConfirm: null };
            const [modal, setModal] = useState(ModalStateInit);

            // AI機能の状態
            const [aiSettings, setAiSettings] = useState({ provider: 'openai', apiKey: '' });
            const [isAiSettingsOpen, setIsAiSettingsOpen] = useState(false);
            const [aiAnalysisResult, setAiAnalysisResult] = useState('');
            const [suggestedCircuit, setSuggestedCircuit] = useState(null);
            const [isAiResultOpen, setIsAiResultOpen] = useState(false);
            const [isAnalyzing, setIsAnalyzing] = useState(false);

            useEffect(() => {
                const savedParams = localStorage.getItem('ubd_ai_params');
                if (savedParams) {
                    try {
                        setAiSettings(JSON.parse(savedParams));
                    } catch (e) {
                        console.error('Failed to load AI settings', e);
                    }
                }
            }, []);

            useEffect(() => {
                setConnectionGraph(buildConnectionGraph(components, wires, boardConfig, junctions));
            }, [components, wires, boardConfig, junctions]);

            useEffect(() => {
                setConnectionValidation(validateConnectionGraph(connectionGraph, wires));
            }, [connectionGraph, wires]);

            const netToWireMap = buildNetToWireMap(connectionGraph, wires);

            // 画面のオフセット（パンニング用）
            const [offset, setOffset] = useState({ x: 0, y: 0 });
            const isRightDragging = useRef(false);
            const lastPanPos = useRef({ x: 0, y: 0 });
            const hasPanned = useRef(false);

            const svgRef = useRef(null);
            const containerRef = useRef(null);

            // 現在の配線色を取得
            const currentWireColor = wireColors[viewSide];

            // 基板全体が収まる倍率（最大1.5倍）にして中央に配置する関数
            const centerBoard = useCallback((config = { width: DEFAULT_BOARD_WIDTH, height: DEFAULT_BOARD_HEIGHT, gridSize: DEFAULT_GRID_SIZE }) => {
                if (containerRef.current) {
                    const containerWidth = containerRef.current.clientWidth;
                    const containerHeight = containerRef.current.clientHeight;
                    const boardWidth = config.width * config.gridSize + config.gridSize;
                    const boardHeight = config.height * config.gridSize + config.gridSize;
                    // 上部のツールバーに隠れないよう上側は広めに余白を取る
                    const margin = 24;
                    const topReserve = 72;
                    const fitScale = Math.min(
                        (containerWidth - margin * 2) / boardWidth,
                        (containerHeight - topReserve - margin) / boardHeight
                    );
                    const newScale = Math.min(1.5, Math.max(0.5, fitScale));

                    setScale(newScale);
                    setOffset({
                        x: (containerWidth - boardWidth * newScale) / 2,
                        y: Math.max(topReserve, topReserve + (containerHeight - topReserve - margin - boardHeight * newScale) / 2)
                    });
                }
            }, []);

            // 初回マウント時に実行
            useEffect(() => {
                centerBoard();
            }, [centerBoard]);

            // グリッド座標の計算（オフセット考慮）
            const getClientPos = (e) => {
                if (e.changedTouches && e.changedTouches.length > 0) {
                    return { x: e.changedTouches[0].clientX, y: e.changedTouches[0].clientY };
                }
                return { x: e.clientX, y: e.clientY };
            };

            const getGridCoords = (clientX, clientY) => {
                if (!svgRef.current) return { x: 0, y: 0 };

                // コンテナの左上からのマウス位置
                const containerRect = containerRef.current.getBoundingClientRect();
                const mouseX = clientX - containerRect.left;
                const mouseY = clientY - containerRect.top;

                // オフセットとスケールを逆算して基板内の座標を求める
                let x = (mouseX - offset.x) / scale;
                const y = (mouseY - offset.y) / scale;

                const totalBoardWidth = boardConfig.width * boardConfig.gridSize + boardConfig.gridSize;
                if (viewSide === 'back') {
                    x = totalBoardWidth - x;
                }
                return {
                    x: Math.round(x / boardConfig.gridSize),
                    y: Math.round(y / boardConfig.gridSize),
                };
            };

            // Touch Handling State
            const touchState = useRef({
                startX: 0, startY: 0,
                isDragging: false,
                isPanned: false,
                activeId: null, // component or wire id being interacted with
                mode: 'tap' // 'tap' or 'pan' or 'drag'
            });

            // Unified Handler for Down/Start
            const handleDeviceDown = (e, type, id) => {
                const pos = getClientPos(e);

                // タッチイベントの場合はスクロール防止（必要に応じて）
                if (e.type === 'touchstart') {
                    // e.preventDefault(); // React synthetic event vs native... mostly handled in CSS touch-action: none
                }

                if (e.type === 'touchstart') {
                    touchState.current = {
                        startX: pos.x,
                        startY: pos.y,
                        isDragging: false,
                        isPanned: false,
                        activeId: id,
                        mode: 'tap'
                    };

                    // タッチ直後は何もしない（タップかドラッグか判定するため）
                    // ただし、部品やハンドルの場合は即座にドラッグ開始とみなしてOKな場合もあるが、
                    // スクロール(パン)したい可能性もあるので、Moveで判定する。
                    // しかし、既存のDndロジックはMouseDownで開始する。

                    if (type === 'component' || type === 'wireEndpoint') {
                        // 部品・ワイヤーハンドルの場合は、即座にドラッグ扱いにしてDndロジックを呼ぶ
                        // これにより、指を置いた瞬間から移動できる
                        const syntheticEvent = {
                            ...e,
                            clientX: pos.x,
                            clientY: pos.y,
                            button: 0,
                            stopPropagation: () => { },
                            preventDefault: () => { }
                        };
                        if (type === 'component') handleComponentDragStart(syntheticEvent, id);
                        else if (type === 'wireEndpoint') handleWireEndpointDragStart(syntheticEvent, id.id, id.type);
                        touchState.current.mode = 'drag';
                    } else {
                        // 背景の場合: パン開始か、ワイヤー作成か
                        // とりあえずパンとみなす
                        touchState.current.mode = 'pan';
                        // handlePanMouseDown 相当のことをするが、右クリックではないので state をセット
                        isRightDragging.current = true;
                        lastPanPos.current = { x: pos.x, y: pos.y };
                        hasPanned.current = false;
                    }
                } else {
                    // Mouse Event -> Pass through to native handlers if attached directly, 
                    // or handle here if we replace onClick/onMouseDown
                    // 現在は onMouseDown 等を個別に呼んでいるので、ここでは何もしないか、あるいは
                    // 全てをここに集約するか。
                    // 今回は Touch のみここを通すように onTouchStart={e => handleDeviceDown(e, ...)} とする予定。
                }
            };

            // Unified Handler for Move
            const handleDeviceMove = (e) => {
                // Mouse move is handled by window listener
                // Touch move needs to be handled here or by window listener
            };

            const generateId = () => Math.random().toString(36).substr(2, 9);

            const isComponentTool = (tool) => Object.values(COMPONENT_DEFINITIONS).some(def => def.id === tool);

            const selectTool = (toolId) => {
                setSelectedTool(toolId);
                setSelectedItem(null);
                setCurrentWireStart(null);
                if (isComponentTool(toolId)) {
                    if (componentSizes[toolId]) {
                        setActiveSize(componentSizes[toolId]);
                    } else {
                        const def = Object.values(COMPONENT_DEFINITIONS).find(c => c.id === toolId);
                        if (def) setActiveSize({ width: def.defaultWidth, height: def.defaultHeight });
                    }
                }
            };

            const handleSizeChange = (key, value) => {
                const newVal = Math.max(1, Number(value));
                const newSize = { ...activeSize, [key]: newVal };
                setActiveSize(newSize);
                if (isComponentTool(selectedTool)) {
                    setComponentSizes(prev => ({ ...prev, [selectedTool]: newSize }));
                }
            };

            const handleAttributeChange = (key, val) => {
                if (!selectedItem || selectedItem.type !== 'component') return;
                setComponents(prev => prev.map(c => c.id === selectedItem.id ? { ...c, [key]: val } : c));
            };

            const normalizePinLabels = (labels, width, height) => {
                const total = Math.max(1, Number(width)) * Math.max(1, Number(height));
                const normalized = Array.isArray(labels) ? labels.slice(0, total) : [];
                while (normalized.length < total) normalized.push('');
                return normalized;
            };

            const updatePinLabel = (index, value) => {
                if (!selectedItem || selectedItem.type !== 'component') return;
                setComponents(prev => prev.map(c => {
                    if (c.id !== selectedItem.id) return c;
                    if (c.type !== 'jumper') return c;
                    const width = c.width || 1;
                    const height = c.height || 1;
                    const labels = normalizePinLabels(c.pinLabels, width, height);
                    const nextValue = value ? value.slice(0, 1) : '';
                    labels[index] = nextValue;
                    return { ...c, pinLabels: labels };
                }));
            };

            // 基板サイズ入力の確定時に、配置済みの部品・配線がはみ出さない大きさに補正する
            const clampBoardSize = (key) => {
                const bounds = getContentBounds(components, wires, boardConfig.gridSize, junctions);
                const contentMax = bounds ? (key === 'width' ? bounds.maxX : bounds.maxY) : 0;
                const requested = Number(boardConfig[key]) || 0;
                const value = Math.min(100, Math.max(5, contentMax, requested));
                if (value !== boardConfig[key]) {
                    setBoardConfig(prev => ({ ...prev, [key]: value }));
                    if (contentMax > requested) openAlert('配置済みの部品・配線が収まるサイズに調整しました。');
                }
            };

            // 部品のピンがすべて基板内に収まるか
            const fitsOnBoard = (comp) => getComponentPinCoords(comp, boardConfig.gridSize).every(p => isInsideBoard(p, boardConfig));

            // 配置済み部品のサイズ変更
            const handleComponentSizeChange = (key, value) => {
                if (!selectedItem || selectedItem.type !== 'component') return;
                const newVal = Math.max(1, Number(value));
                const target = components.find(c => c.id === selectedItem.id);
                if (target && !fitsOnBoard({ ...target, [key]: newVal })) {
                    openAlert('このサイズでは基板からはみ出します。');
                    return;
                }
                setComponents(prev => prev.map(c => {
                    if (c.id !== selectedItem.id) return c;
                    const newWidth = key === 'width' ? newVal : c.width;
                    const newHeight = key === 'height' ? newVal : c.height;
                    const updated = { ...c, width: newWidth, height: newHeight };
                    if (updated.type === 'jumper') {
